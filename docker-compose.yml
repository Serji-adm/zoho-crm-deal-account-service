version: '3.8'

services:
    zoho-crm-app:
        container_name: container-zoho-crm-app
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - ./:/var/www/html
        depends_on:
            - zoho-crm-db
        networks:
            - zoho_crm_network
        environment:
            DB_CONNECTION: mysql
            DB_HOST: zoho-crm-db
            DB_PORT: 3306
            DB_DATABASE: zoho_crm_db
            DB_USERNAME: zoho_crm_user
            DB_PASSWORD: zoho_crm_password

    zoho-crm-db:
        image: mysql:8.0
        container_name: container-zoho-crm-db
        restart: always
        environment:
            MYSQL_DATABASE: zoho_crm_db
            MYSQL_ROOT_PASSWORD: root
            MYSQL_USER: zoho_crm_user
            MYSQL_PASSWORD: zoho_crm_password
        ports:
            - "3306:3306"
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - zoho_crm_network

    zoho-crm-nginx:
        image: nginx:latest
        container_name: zoho-crm-app-nginx
        restart: always
        ports:
            - "8001:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - zoho-crm-app
        networks:
            - zoho_crm_network

networks:
    zoho_crm_network:

volumes:
    dbdata:
